name: Build and deploy pancake calculator

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check recipe quantities
        run: dotnet run --project Pancakes.Web.Checks --configuration Release
      - name: Publish browser app
        run: dotnet publish Pancakes.Web --configuration Release --output published
      - name: Prepare GitHub Pages files
        run: |
          sed -i 's|<base href="/" />|<base href="/pancakes/" />|' published/wwwroot/index.html
          touch published/wwwroot/.nojekyll
          cp published/wwwroot/index.html published/wwwroot/404.html
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: published/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
